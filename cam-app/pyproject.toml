[project]
name = "fieldcam"
version = "0.1.0"
description = "Web app for scheduling and managing live camera streams for ball field events"
requires-python = ">=3.11"
dependencies = [
    "apscheduler",
    "datastar-py>=0.8.0",
    "fastapi-login",
    "fastapi-proxiedheadersmiddleware",
    "fastapi[standard]",
    "jinja2",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy",
    "uvicorn[standard]",
    "pillow",
    "ruff",
    # YOLOv8 person/bird detection runs on a pre-exported ONNX model — no torch.
    # onnxruntime ships cp311 manylinux aarch64 wheels and pulls numpy in.
    "onnxruntime",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
]
# Tooling to regenerate app/models/yolov8n.onnx from the upstream .pt weights.
# Heavy (torch), local/dev only — never installed into the runtime image:
#   uv run --extra export python -c "from ultralytics import YOLO; \
#     YOLO('yolov8n.pt').export(format='onnx', imgsz=640, opset=12)"
export = [
    "ultralytics==8.4.14",
    "onnx",
    "onnxslim",
]

[tool.ruff]
line-length = 150
target-version = "py311"
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["jobs*"]
